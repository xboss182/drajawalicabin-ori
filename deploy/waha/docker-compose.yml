name: waha

# WAHA Core (NOWEB engine) — private sidecar for drajawalicabin booking bridge.
# WAHA is bound to 127.0.0.1 only; no public exposure. The booking bridge
# reaches it over the shared `waha-net` network at http://waha:3000 with header
# X-Api-Key. QR pairing requires an SSH tunnel:
#   ssh -L 3100:127.0.0.1:3100 root@77.90.27.247
#
# ponytail: WAHA Core + NOWEB is the MVP floor (no license needed). Upgrade to
# waha-plus when we need multi-session, S3 media offload, or webhook retry
# policies — tracked as a known limitation on MNC-962.

services:
  waha:
    image: devlikeapro/waha@sha256:269a1ab26478763609af03c7fb30f3657a3256b2a287976cc416c61ed29c1542  # waha:noweb 2026-08-14
    container_name: waha
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_PRINT_QR: "false"           # QR served via /api/sessions/{s}/auth/qr over the tunnel
      WAHA_DASHBOARD_ENABLED: "false"  # no web UI; API-only, smaller attack surface
      WAHA_SWAGGER_ENABLED: "false"    # same reason
      WAHA_MEDIA_STORAGE: LOCAL        # bridge pulls proof media and re-persists to Lovable Cloud
      WAHA_AUTO_DOWNLOAD_MEDIA: "true" # required for payment-proof images
      WHATSAPP_FILES_LIFETIME: "604800" # 7d local cache, matches MNC-958 §9
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - waha-sessions:/app/.sessions
      - waha-media:/app/.media
    networks:
      - waha-net
    healthcheck:
      # /api/server/version is the lightest authenticated liveness probe on Core.
      # $$ escapes to a literal $ for the container shell; key comes from env_file.
      test: ["CMD-SHELL", "curl -fsS -H \"X-Api-Key: $$WAHA_API_KEY\" http://127.0.0.1:3000/api/server/version >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G           # MNC-958 §11: NOWEB floor is ~1 GB
          cpus: "1.0"
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=waha,project=drajawali"

  # Booking bridge (MNC-961 artifact). Built from the repo's wa-bridge/ tree on a
  # branch that carries the Backend Developer's corrected code (durable event
  # processing, resumable proofs, env-only payment config). This service is the
  # ONLY consumer of WAHA and the ONLY component WAHA webhooks point at.
  #
  # Enable after the corrected wa-bridge/ lands on this branch:
  #   docker compose up -d --build bridge
  bridge:
    build:
      # Context is the repo's wa-bridge/ tree (Backend Developer's corrected
      # artifact). Dockerfile lives here in deploy/waha/ so this deployment PR is
      # self-contained and does not depend on the backend branch carrying one.
      context: ../../wa-bridge
      dockerfile: ../../deploy/waha/bridge.Dockerfile
    container_name: wa-bridge
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WAHA_URL: "http://waha:3000"
      WAHA_SESSION: "default"
      BRIDGE_PORT: "8080"
      # WAHA_API_KEY, WAHA_WEBHOOK_HMAC_KEY, WA_MACHINE_SECRET, MACHINE_URL come
      # from .env (mode 600). No literal is ever committed.
    # Loopback-only: WAHA posts webhooks here over waha-net; nothing public.
    # Host port 8180 (8080 is already bound by the unrelated multica-backend).
    ports:
      - "127.0.0.1:8180:8080"
    networks:
      - waha-net
    depends_on:
      waha:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=wa-bridge,project=drajawali"

networks:
  waha-net:
    name: waha-net
    driver: bridge

volumes:
  waha-sessions:
    name: waha-sessions
  waha-media:
    name: waha-media
