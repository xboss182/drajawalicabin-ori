[install]
# 24h supply-chain guard: skip package versions published less than a day ago.
minimumReleaseAge = 86400
# Each entry bypasses the 24h guard for one package — confirm with the user
# before adding any.
minimumReleaseAgeExcludes = ["@lovable.dev/vite-tanstack-config", "@lovable.dev/mcp-js", "@lovable.dev/vite-plugin-dev-server-bridge", "@lovable.dev/vite-plugin-hmr-gate", "@tanstack/react-start", "@tanstack/react-router", "@tanstack/react-start-client", "@tanstack/react-start-rsc", "@tanstack/react-start-server", "@tanstack/start-client-core", "@tanstack/start-plugin-core", "@tanstack/start-server-core"]
